         offset on every tab switch, so listings open at a stale position and
         a half-filled form is no longer where the user left it. */

        }

             path segments ("#/clients", "#/dashboard") so an optional record id
             ("#/clients/42") reuses the same remembered position instead of
             silently starting at the top of a different list. */

           not painted yet and the document is still short — scrolling straight
           away would clamp to 0. Retry across a few frames until the layout is

         for one frame, then 12 while the role-gated entries resolve
         (scrollHeight 556), then 20 again. The nav's own height is fixed at
         349px by the flex parent, so only the content height moves - and with
         it the maximum scroll, from 559 down to 207. An offset of 300 is then
         physically impossible and the browser clamps it, which is the jump.
         Re-applying scrollTop cannot prevent that: there is nowhere to scroll
         to. The range has to stay wide instead, so pad the nav by exactly the
         height it is short by, and remove the padding once the items are back.
         Scoped to a click, and abandoned the moment the user scrolls, so this
